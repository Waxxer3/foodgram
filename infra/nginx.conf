server {
    listen 80;
    server_name foodgramyandexprac.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name foodgramyandexprac.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/foodgramyandexprac.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgramyandexprac.duckdns.org/privkey.pem;

    location /static/admin/ {
        alias /app/static/admin/;
    }
    location /static/rest_framework/ {
        alias /app/static/rest_framework/;
    }

    location /media/ {
        alias /app/media/; 
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location /s/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }
}