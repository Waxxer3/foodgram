server {
    listen 80;
    server_name foodgramyandexprac.duckdns.org 158.160.211.228;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name foodgramyandexprac.duckdns.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/foodgramyandexprac.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgramyandexprac.duckdns.org/privkey.pem;

    location /static/admin/ {
        alias /var/html/static/admin/;
    }

    location /static/rest_framework/ {
        alias /var/html/static/rest_framework/;
    }

    location /media/ {
        alias /var/html/media/;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    # Фронтенд
    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }
}