server {
    listen 80;
    server_name foodgramyandexprac.duckdns.org;
    # Автоматический редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name foodgramyandexprac.duckdns.org;

    # Пути к сертификатам (теперь они будут видны внутри контейнера)
    ssl_certificate /etc/letsencrypt/live/foodgramyandexprac.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foodgramyandexprac.duckdns.org/privkey.pem;

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/redoc.html;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location /s/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/s/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        root /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }
}